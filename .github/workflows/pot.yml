name: Update Translation Template (.pot)

on:
  push:
    branches:
      - main
      - gnome45-49
    paths:
      - 'extension.js'
      - 'prefs.js'
      - 'src/**/*.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-pot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Extract strings to po/messages.pot
        run: python3 .github/scripts/update_pot.py

      - name: Commit and push updated messages.pot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add po/messages.pot
          if git diff --cached --quiet; then
            echo "No translatable string changes detected."
            exit 0
          fi
          git commit -m "chore(locale): update messages.pot template"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
